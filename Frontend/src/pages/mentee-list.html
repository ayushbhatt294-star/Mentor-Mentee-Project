<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Mentees</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Lato', sans-serif; background-color: #f1f5f9; }
    h1,h2,h3,.brand { font-family: 'Nunito', sans-serif; }

    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; width: 230px;
      background: linear-gradient(180deg, #1e3a5f 0%, #1a3557 100%);
      z-index: 40; transition: transform 0.3s ease; display: flex; flex-direction: column;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-radius: 10px; margin: 2px 10px;
      color: #c9d9ee; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease; text-decoration: none;
    }
    .sidebar-link:hover { background: rgba(255,255,255,0.1); color: white; }
    .sidebar-link.active { background: rgba(255,255,255,0.15); color: white; }
    .sidebar-link .icon { width: 20px; height: 20px; flex-shrink: 0; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 35; }
    .overlay.show { display: block; }

    .main { margin-left: 230px; min-height: 100vh; }

    .topbar {
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 30;
    }

    .card { background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

    /* Search & filter bar */
    .search-input {
      border: 2px solid #e5e7eb; border-radius: 10px;
      padding: 9px 14px 9px 38px; font-size: 0.875rem;
      color: #1f2937; background: #f9fafb; width: 100%;
      transition: border-color 0.2s; font-family: 'Lato', sans-serif;
    }
    .search-input:focus { outline: none; border-color: #2563eb; background: white; }

    .filter-select {
      border: 2px solid #e5e7eb; border-radius: 10px;
      padding: 9px 12px; font-size: 0.875rem; color: #374151;
      background: #f9fafb; cursor: pointer; font-family: 'Lato', sans-serif;
    }
    .filter-select:focus { outline: none; border-color: #2563eb; }

    /* Mentee card */
    .mentee-card {
      background: white; border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      transition: all 0.18s ease; cursor: pointer;
    }
    .mentee-card:hover { border-color: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.1); }

    .avatar {
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; font-family: 'Nunito', sans-serif;
      flex-shrink: 0;
    }

    /* Status badges */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 99px;
    }
    .badge-active   { background: #dcfce7; color: #15803d; }
    .badge-inactive { background: #fee2e2; color: #b91c1c; }
    .badge-logdue   { background: #fef9c3; color: #a16207; }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }

    /* Pagination */
    .page-btn {
      width: 36px; height: 36px; border-radius: 8px; border: 2px solid #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.875rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s; color: #374151; background: white;
      font-family: 'Nunito', sans-serif;
    }
    .page-btn:hover:not(:disabled) { border-color: #2563eb; color: #2563eb; }
    .page-btn.active { background: #2563eb; border-color: #2563eb; color: white; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Avatar colors pool */
    .av-1 { background:#dbeafe; color:#1d4ed8; }
    .av-2 { background:#fce7f3; color:#be185d; }
    .av-3 { background:#d1fae5; color:#065f46; }
    .av-4 { background:#fef3c7; color:#92400e; }
    .av-5 { background:#ede9fe; color:#5b21b6; }
    .av-6 { background:#ffedd5; color:#c2410c; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .topbar { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="px-5 py-5 border-b border-white border-opacity-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-white bg-opacity-20 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422A12.083 12.083 0 0121 21H3a12.083 12.083 0 012.84-10.422L12 14z"/>
        </svg>
      </div>
      <div>
        <p class="brand text-white font-extrabold text-sm leading-tight">Mentor Portal</p>
        <p class="text-blue-300 text-xs">University</p>
      </div>
    </div>
  </div>

  <div class="px-5 py-4 border-b border-white border-opacity-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-blue-400 flex items-center justify-center text-white font-bold text-sm flex-shrink-0" id="sidebar-avatar">--</div>
      <div>
        <p class="text-white font-bold text-sm leading-tight" id="sidebar-name">—</p>
        <p class="text-blue-300 text-xs" id="sidebar-dept">—</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 py-4 overflow-y-auto">
    <p class="text-blue-400 text-xs font-bold uppercase px-5 mb-2 tracking-wider">Menu</p>
    <a href="mentor-dashboard.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Dashboard
    </a>
    <a href="mentor-profile.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      My Profile
    </a>
    <a href="mentee-list.html" class="sidebar-link active">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m4-4a4 4 0 100-8 4 4 0 000 8z"/></svg>
      My Mentees
    </a>
    <a href="mentor-interactions.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 16c0 1.105-3.582 2-8 2s-8-.895-8-2V8c0-1.105 3.582-2 8-2s8 .895 8 2v8z"/></svg>
      Interactions
    </a>
    <div class="h-px bg-white bg-opacity-10 mx-5 my-3"></div>
    <a href="login.html" class="sidebar-link" style="color:#f87171;">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/></svg>
      Logout
    </a>
  </nav>
</aside>

<!-- ===== MAIN ===== -->
<div class="main">

  <!-- Topbar -->
  <header class="topbar">
    <div class="flex items-center gap-3">
      <button onclick="openSidebar()" class="md:hidden text-gray-500 hover:text-blue-700">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 class="brand text-lg font-extrabold text-gray-800 leading-tight">My Mentees</h1>
        <p class="text-xs text-gray-400 hidden sm:block">All students assigned to you</p>
      </div>
    </div>
    <!-- Total count badge -->
    <div class="bg-blue-50 text-blue-700 text-sm font-bold px-3 py-1.5 rounded-lg brand" id="total-count">
      — Students
    </div>
  </header>

  <div class="p-4 md:p-6 max-w-5xl mx-auto">

    <!-- Search + Filter bar -->
    <div class="flex flex-col sm:flex-row gap-3 mb-5">
      <!-- Search -->
      <div class="relative flex-1">
        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/></svg>
        <input type="text" id="search-input" placeholder="Search by name, roll no, or email..."
          class="search-input" oninput="applyFilters()"/>
      </div>
      <!-- Year filter -->
      <select id="filter-year" class="filter-select" onchange="applyFilters()">
        <option value="">All Years</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <!-- Status filter -->
      <select id="filter-status" class="filter-select" onchange="applyFilters()">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="log_due">Log Due</option>
      </select>
    </div>

    <!-- Skeleton loader -->
    <div id="skeleton-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="mentee-card space-y-3">
        <div class="flex items-center gap-3"><div class="skeleton w-12 h-12 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div></div>
        <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-2/3"></div>
      </div>
      <div class="mentee-card space-y-3">
        <div class="flex items-center gap-3"><div class="skeleton w-12 h-12 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div></div>
        <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-2/3"></div>
      </div>
      <div class="mentee-card space-y-3">
        <div class="flex items-center gap-3"><div class="skeleton w-12 h-12 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div></div>
        <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-2/3"></div>
      </div>
    </div>

    <!-- Mentee Grid -->
    <div id="mentee-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state hidden">
      <svg class="w-14 h-14 mx-auto mb-3 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m4-4a4 4 0 100-8 4 4 0 000 8z"/></svg>
      <p class="font-bold text-gray-400 brand text-lg">No mentees found</p>
      <p class="text-sm text-gray-400 mt-1">Try changing your search or filter.</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-5 py-4 text-sm font-semibold flex items-center gap-2">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <span id="error-msg">Failed to load mentees.</span>
      <button onclick="loadMentees()" class="ml-auto underline text-red-700 font-bold">Retry</button>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex items-center justify-between mt-6 hidden">
      <p class="text-sm text-gray-500" id="pagination-info"></p>
      <div class="flex items-center gap-2" id="pagination-btns"></div>
    </div>

    <div class="h-6"></div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────
  // CONFIG
  // ─────────────────────────────────────────────
  const BASE_URL  = '';           // e.g. 'http://localhost:5000'
  const TOKEN_KEY = 'mentor_token';
  const PAGE_SIZE = 9;            // cards per page

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

  // ─────────────────────────────────────────────
  // API
  // ─────────────────────────────────────────────
  async function fetchMentees() {
    /* ── REAL API (uncomment when backend ready) ──
    const res = await fetch(`${BASE_URL}/api/mentor/mentees`, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) throw new Error('Failed to fetch');
    return await res.json();   // expected: Array of mentee objects
    */

    // ── MOCK: returns empty array until real API connected ──
    return new Promise(resolve => setTimeout(() => resolve([]), 800));
  }

  // Expected mentee object shape from API:
  // {
  //   id: 1,
  //   full_name: 'Student Name',
  //   roll_number: '2021CS001',
  //   email: 'student@university.edu',
  //   phone: '9876543210',
  //   year: 2,               // 1 | 2 | 3 | 4
  //   branch: 'CSE',
  //   status: 'active',      // 'active' | 'inactive' | 'log_due'
  //   last_interaction: '2025-05-10'   // ISO date string or null
  // }

  // ─────────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────────
  let allMentees    = [];
  let filtered      = [];
  let currentPage   = 1;

  // Avatar color pool (cycles by index)
  const avColors = ['av-1','av-2','av-3','av-4','av-5','av-6'];

  function getInitials(name) {
    if (!name) return '--';
    return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function badgeHTML(status) {
    const map = {
      active:   ['badge-active',   '● Active'],
      inactive: ['badge-inactive', '● Inactive'],
      log_due:  ['badge-logdue',   '● Log Due'],
    };
    const [cls, label] = map[status] || ['badge-active', status || '—'];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function yearLabel(year) {
    const suffix = ['st','nd','rd','th'];
    return year ? `${year}${suffix[(year-1)] || 'th'} Year` : '—';
  }

  function formatDate(dateStr) {
    if (!dateStr) return 'No interactions yet';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  }

  // ─────────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('mentee-grid');
    const empty = document.getElementById('empty-state');
    const pag   = document.getElementById('pagination');

    if (filtered.length === 0) {
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
      pag.classList.add('hidden');
      return;
    }

    empty.classList.add('hidden');
    grid.classList.remove('hidden');

    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = 1;

    const start = (currentPage - 1) * PAGE_SIZE;
    const page  = filtered.slice(start, start + PAGE_SIZE);

    grid.innerHTML = page.map((m, i) => {
      const colorClass = avColors[(start + i) % avColors.length];
      const initials   = getInitials(m.full_name);
      return `
        <div class="mentee-card" onclick="goToDetail(${m.id})">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-3">
              <div class="avatar ${colorClass}">${initials}</div>
              <div>
                <p class="font-bold text-gray-800 text-sm leading-tight">${m.full_name || '—'}</p>
                <p class="text-xs text-gray-400 mt-0.5">${m.roll_number || '—'}</p>
              </div>
            </div>
            ${badgeHTML(m.status)}
          </div>

          <div class="space-y-1.5 text-xs text-gray-500">
            <div class="flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 01-2-2V7l7-4 7 4v12a2 2 0 01-2 2z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 21V12h6v9"/></svg>
              <span>${yearLabel(m.year)} · ${m.branch || '—'}</span>
            </div>
            <div class="flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <span class="truncate">${m.email || '—'}</span>
            </div>
            <div class="flex items-center gap-2">
              <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              <span>Last: ${formatDate(m.last_interaction)}</span>
            </div>
          </div>

          <div class="mt-3 pt-3 border-t border-gray-100 flex justify-end">
            <span class="text-blue-600 text-xs font-bold">View Details →</span>
          </div>
        </div>`;
    }).join('');

    // Pagination
    renderPagination(totalPages, filtered.length, start, page.length);
  }

  function renderPagination(totalPages, total, start, count) {
    const pag  = document.getElementById('pagination');
    const info = document.getElementById('pagination-info');
    const btns = document.getElementById('pagination-btns');

    if (totalPages <= 1) { pag.classList.add('hidden'); return; }
    pag.classList.remove('hidden');

    info.textContent = `Showing ${start + 1}–${start + count} of ${total} students`;

    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
      html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
    btns.innerHTML = html;
  }

  function goPage(p) {
    currentPage = p;
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─────────────────────────────────────────────
  // SEARCH & FILTER
  // ─────────────────────────────────────────────
  function applyFilters() {
    const q      = document.getElementById('search-input').value.toLowerCase().trim();
    const year   = document.getElementById('filter-year').value;
    const status = document.getElementById('filter-status').value;

    filtered = allMentees.filter(m => {
      const matchSearch = !q || [m.full_name, m.roll_number, m.email].some(v => v && v.toLowerCase().includes(q));
      const matchYear   = !year   || String(m.year) === year;
      const matchStatus = !status || m.status === status;
      return matchSearch && matchYear && matchStatus;
    });

    currentPage = 1;
    renderGrid();
  }

  // ─────────────────────────────────────────────
  // NAVIGATION to detail page
  // ─────────────────────────────────────────────
  function goToDetail(menteeId) {
    // Pass mentee id via URL param — detail page reads it and fetches from API
    window.location.href = `mentee-detail.html?id=${menteeId}`;
  }

  // ─────────────────────────────────────────────
  // LOAD
  // ─────────────────────────────────────────────
  async function loadMentees() {
    document.getElementById('skeleton-grid').classList.remove('hidden');
    document.getElementById('mentee-grid').classList.add('hidden');
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('error-state').classList.add('hidden');
    document.getElementById('pagination').classList.add('hidden');
    document.getElementById('total-count').textContent = '— Students';

    try {
      const data = await fetchMentees();
      allMentees = Array.isArray(data) ? data : [];
      filtered   = [...allMentees];

      document.getElementById('total-count').textContent = allMentees.length + ' Student' + (allMentees.length !== 1 ? 's' : '');
      document.getElementById('skeleton-grid').classList.add('hidden');

      // Populate sidebar mentor info from localStorage / session if available
      // (set by login page after JWT decode)
      const mentorName = localStorage.getItem('mentor_name') || '—';
      const mentorDept = localStorage.getItem('mentor_dept') || '—';
      document.getElementById('sidebar-name').textContent = mentorName;
      document.getElementById('sidebar-dept').textContent = mentorDept;
      const initials = mentorName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) || '--';
      document.getElementById('sidebar-avatar').textContent = initials;

      renderGrid();
    } catch (err) {
      document.getElementById('skeleton-grid').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-msg').textContent = 'Could not load mentees. Please try again.';
    }
  }

  // ─────────────────────────────────────────────
  // SIDEBAR
  // ─────────────────────────────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  // ─────────────────────────────────────────────
  // START
  // ─────────────────────────────────────────────
  loadMentees();
</script>
</body>
</html>
