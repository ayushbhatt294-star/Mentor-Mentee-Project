<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Logs – Mentee Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Lato', sans-serif; background-color: #f1f5f9; }
    h1,h2,h3,.brand { font-family: 'Nunito', sans-serif; }

    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; width: 230px;
      background: linear-gradient(180deg, #1e3a5f 0%, #1a3557 100%);
      z-index: 40; transition: transform 0.3s ease;
      display: flex; flex-direction: column;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-radius: 10px; margin: 2px 10px;
      color: #c9d9ee; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease; text-decoration: none;
    }
    .sidebar-link:hover { background: rgba(255,255,255,0.1); color: white; }
    .sidebar-link.active { background: rgba(255,255,255,0.15); color: white; }
    .sidebar-link .icon { width: 20px; height: 20px; flex-shrink: 0; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 35; }
    .overlay.show { display: block; }
    .main { margin-left: 230px; min-height: 100vh; }
    .topbar {
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 30;
    }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .badge-verified   { background:#dcfce7; color:#15803d; }
    .badge-pending    { background:#fef9c3; color:#a16207; }
    .badge-unverified { background:#fee2e2; color:#b91c1c; }
    .avatar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; font-family:'Nunito',sans-serif; flex-shrink:0; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
    }

    /* Filter tabs */
    .filter-tab {
      padding: 7px 18px; border-radius: 99px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s ease; border: 2px solid transparent;
      font-family: 'Nunito', sans-serif;
    }
    .filter-tab.active { background: #1e3a5f; color: white; }
    .filter-tab:not(.active) { background: #f1f5f9; color: #64748b; }
    .filter-tab:not(.active):hover { background: #e2e8f0; }

    /* Log card */
    .log-card {
      border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .log-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }

    /* Detail modal */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: white; border-radius: 18px; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .fade-up { opacity:0; transform:translateY(12px); animation: fadeUp 0.35s ease forwards; }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

    .search-box {
      border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 9px 14px;
      font-size: 0.875rem; font-family: 'Lato', sans-serif; outline: none;
      transition: border-color 0.18s ease; width: 100%;
    }
    .search-box:focus { border-color: #3b82f6; }

    /* Empty state */
    .empty-state { text-align:center; padding:48px 16px; color:#94a3b8; }
    .empty-state svg { margin:0 auto 12px; opacity:0.35; }
    .empty-state p { font-size:0.9rem; font-weight:700; font-family:'Nunito',sans-serif; }
    .empty-state span { font-size:0.75rem; }

    .notif-dot { width:8px; height:8px; border-radius:50%; background:#ef4444; display:inline-block; }
    .progress-bar { height:6px; border-radius:99px; background:#e2e8f0; overflow:hidden; }
    .progress-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#2563eb,#38bdf8); }
  </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="px-5 py-5 border-b border-white border-opacity-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-white bg-opacity-20 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422A12.083 12.083 0 0121 21H3a12.083 12.083 0 012.84-10.422L12 14z"/>
        </svg>
      </div>
      <div>
        <p class="brand text-white font-extrabold text-sm leading-tight">Mentee Portal</p>
        <p class="text-blue-300 text-xs">University</p>
      </div>
    </div>
  </div>
  <div class="px-5 py-4 border-b border-white border-opacity-10">
    <div class="flex items-center gap-3">
      <div class="avatar bg-blue-400 text-white" id="sidebar-avatar" style="width:42px;height:42px;font-size:1rem;">--</div>
      <div>
        <p class="text-white font-bold text-sm leading-tight" id="sidebar-name">Loading...</p>
        <p class="text-blue-300 text-xs" id="sidebar-program">--</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 py-4 overflow-y-auto">
    <p class="text-blue-400 text-xs font-bold uppercase px-5 mb-2 tracking-wider">Menu</p>
    <a href="mentee-dashboard.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Dashboard
    </a>
    <a href="mentee-profile.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      My Profile
    </a>
    <a href="mentee-logs.html" class="sidebar-link active">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      My Logs
    </a>
    <a href="mentee-schedule.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Schedule &amp; Reminders
    </a>
    <a href="mentee-activities.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
      Activities
    </a>
    <a href="mentee-settings.html" class="sidebar-link">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </a>
    <div class="h-px bg-white bg-opacity-10 mx-5 my-3"></div>
    <a href="login.html" class="sidebar-link" style="color:#f87171;">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/></svg>
      Logout
    </a>
  </nav>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="topbar">
    <div class="flex items-center gap-3">
      <button onclick="openSidebar()" class="md:hidden text-gray-500 hover:text-blue-700">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 class="brand text-lg font-extrabold text-gray-800 leading-tight">My Interaction Logs</h1>
        <p class="text-xs text-gray-400 hidden sm:block">View-only — sign-offs managed by your mentor</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-400 hidden sm:block" id="current-date"></span>
      <div class="avatar bg-blue-700 text-white" id="topbar-avatar" style="width:36px;height:36px;font-size:0.8rem;">--</div>
    </div>
  </header>

  <div class="p-4 md:p-6 max-w-5xl mx-auto">

    <!-- Summary bar -->
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="card text-center fade-up" style="animation-delay:0.05s">
        <p class="text-2xl font-extrabold brand text-gray-800" id="sum-total">—</p>
        <p class="text-xs text-gray-500 font-semibold mt-0.5">Total Logs</p>
      </div>
      <div class="card text-center fade-up" style="animation-delay:0.1s">
        <p class="text-2xl font-extrabold brand text-green-600" id="sum-verified">—</p>
        <p class="text-xs text-gray-500 font-semibold mt-0.5">Both Verified</p>
      </div>
      <div class="card text-center fade-up" style="animation-delay:0.15s">
        <p class="text-2xl font-extrabold brand text-yellow-500" id="sum-pending">—</p>
        <p class="text-xs text-gray-500 font-semibold mt-0.5">Pending</p>
      </div>
    </div>

    <!-- Filters + Search -->
    <div class="card mb-4 fade-up" style="animation-delay:0.2s">
      <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
        <div class="flex gap-2 flex-wrap">
          <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
          <button class="filter-tab" onclick="setFilter('verified', this)">Fully Verified</button>
          <button class="filter-tab" onclick="setFilter('pending', this)">Pending</button>
          <button class="filter-tab" onclick="setFilter('mine-pending', this)">Awaiting My Sign-off</button>
        </div>
        <div class="relative w-full sm:w-52">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" class="search-box pl-9" placeholder="Search remarks..." id="search-input" oninput="renderLogs()">
        </div>
      </div>
    </div>

    <!-- Logs list -->
    <div class="card fade-up" style="animation-delay:0.25s">
      <div id="logs-container">
        <div class="empty-state">
          <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <p>Loading logs...</p>
          <span>Please wait</span>
        </div>
      </div>
    </div>

    <div class="h-6"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="flex items-center justify-between p-5 border-b border-gray-100">
      <h2 class="brand font-extrabold text-gray-800 text-lg">Log Details</h2>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-5" id="modal-body"></div>
  </div>
</div>

<script>
  /* ── Utility ── */
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
  function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
  function formatDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
  function getInitials(n){if(!n)return'--';return n.trim().split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();}

  const BASE_URL = '/api';
  const rollNo   = sessionStorage.getItem('rollNo') || null;
  const token    = sessionStorage.getItem('token')  || null;
  const headers  = {'Content-Type':'application/json',...(token?{'Authorization':`Bearer ${token}`}:{})};

  let allLogs    = [];
  let activeFilter = 'all';

  async function init() {
    // Load profile
    try {
      if (rollNo) {
        const res  = await fetch(`${BASE_URL}/mentee/profile/${rollNo}`,{headers});
        const data = await res.json();
        const name = data.studentName||'';
        document.getElementById('sidebar-name').textContent    = name||'Student';
        document.getElementById('sidebar-program').textContent = data.programName?`${data.programName} · Sem ${data.semester}`:'—';
        const init = getInitials(name);
        document.getElementById('sidebar-avatar').textContent  = init;
        document.getElementById('topbar-avatar').textContent   = init;
      }
    } catch(e){}

    // Load logs
    try {
      if (rollNo) {
        const res  = await fetch(`${BASE_URL}/mentee/logs/${rollNo}`,{headers});
        allLogs    = await res.json();
      }
    } catch(e) {
      console.error('Error fetching logs:', e);
    }

    updateSummary();
    renderLogs();
  }

  function updateSummary() {
    document.getElementById('sum-total').textContent    = allLogs.length;
    document.getElementById('sum-verified').textContent = allLogs.filter(l=>l.menteeVerified&&l.facultyVerified).length;
    document.getElementById('sum-pending').textContent  = allLogs.filter(l=>!l.menteeVerified||!l.facultyVerified).length;
  }

  function setFilter(f, el) {
    activeFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    renderLogs();
  }

  function renderLogs() {
    const q = (document.getElementById('search-input').value||'').toLowerCase();
    let filtered = allLogs;

    if (activeFilter === 'verified')      filtered = filtered.filter(l=>l.menteeVerified&&l.facultyVerified);
    if (activeFilter === 'pending')       filtered = filtered.filter(l=>!l.menteeVerified||!l.facultyVerified);
    if (activeFilter === 'mine-pending')  filtered = filtered.filter(l=>!l.menteeVerified);
    if (q) filtered = filtered.filter(l=>(l.academicRemarks||'').toLowerCase().includes(q)||(l.meetingType||'').toLowerCase().includes(q));

    const container = document.getElementById('logs-container');

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p>No logs found</p><span>Try a different filter or search term</span></div>`;
      return;
    }

    container.innerHTML = filtered.map((log, i) => {
      const mv = log.menteeVerified, fv = log.facultyVerified;
      const mBadge = mv ? `<span class="badge-verified text-xs font-bold px-2.5 py-1 rounded-full">You ✓</span>` : `<span class="badge-pending text-xs font-bold px-2.5 py-1 rounded-full">Awaiting Your Sign-off</span>`;
      const fBadge = fv ? `<span class="badge-verified text-xs font-bold px-2.5 py-1 rounded-full">Mentor ✓</span>` : `<span class="badge-unverified text-xs font-bold px-2.5 py-1 rounded-full">Mentor Pending</span>`;
      const bothOk = mv && fv;
      return `<div class="log-card mb-3 last:mb-0" onclick="openModal(${log.interactionID})" style="animation-delay:${i*0.05}s">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-start gap-3 flex-1">
            <div class="w-10 h-10 ${bothOk?'bg-green-100':'bg-blue-100'} rounded-xl flex items-center justify-center flex-shrink-0 mt-0.5">
              <svg class="w-5 h-5 ${bothOk?'text-green-600':'text-blue-600'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-gray-800 text-sm">${formatDate(log.interactionDate)}</span>
                <span class="text-xs bg-gray-100 text-gray-600 font-semibold px-2 py-0.5 rounded-full">${log.meetingType||'Meeting'}</span>
                ${log.semester?`<span class="text-xs bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded-full">Sem ${log.semester}</span>`:''}
              </div>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">${(log.academicRemarks||'No remarks').substring(0,100)}${(log.academicRemarks||'').length>100?'…':''}</p>
              ${log.venue?`<p class="text-xs text-gray-400 mt-0.5">📍 ${log.venue}</p>`:''}
            </div>
          </div>
          <div class="flex flex-col gap-1 flex-shrink-0 items-end">
            ${mBadge}
            ${fBadge}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function openModal(id) {
    const log = allLogs.find(l=>l.interactionID===id);
    if (!log) return;
    const mv = log.menteeVerified, fv = log.facultyVerified;
    document.getElementById('modal-body').innerHTML = `
      <div class="space-y-4">
        <div class="flex flex-wrap gap-2 items-center">
          <span class="brand font-extrabold text-gray-800">${formatDate(log.interactionDate)}</span>
          <span class="text-xs bg-gray-100 text-gray-600 font-semibold px-2.5 py-1 rounded-full">${log.meetingType||'Meeting'}</span>
          ${log.semester?`<span class="text-xs bg-blue-50 text-blue-600 font-semibold px-2.5 py-1 rounded-full">Semester ${log.semester}</span>`:''}
        </div>
        ${log.venue?`<p class="text-sm text-gray-500">📍 <span class="font-semibold">${log.venue}</span></p>`:''}

        <div class="grid grid-cols-2 gap-2 pt-1">
          <div class="p-3 rounded-xl ${mv?'bg-green-50':'bg-yellow-50'}">
            <p class="text-xs font-bold ${mv?'text-green-700':'text-yellow-700'}">${mv?'✓ You signed off':'⏳ Awaiting your sign-off'}</p>
          </div>
          <div class="p-3 rounded-xl ${fv?'bg-green-50':'bg-red-50'}">
            <p class="text-xs font-bold ${fv?'text-green-700':'text-red-700'}">${fv?'✓ Mentor signed off':'✗ Mentor pending'}</p>
          </div>
        </div>

        ${section('Academic Remarks', log.academicRemarks)}
        ${section('Personal Remarks', log.personalRemarks)}
        ${section('Mental Health Remarks', log.mentalHealthRemarks)}
        ${section('Financial Remarks', log.financialRemarks)}

        <div class="pt-2 pb-1">
          <p class="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2 text-center font-semibold">
            🔒 This is a view-only record. Contact your mentor to update sign-offs.
          </p>
        </div>
      </div>`;
    document.getElementById('modal-bg').classList.add('open');
  }

  function section(title, content) {
    if (!content) return '';
    return `<div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">${title}</p>
      <p class="text-sm text-gray-700 bg-gray-50 rounded-lg p-3 leading-relaxed">${content}</p>
    </div>`;
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById('modal-bg')) {
      document.getElementById('modal-bg').classList.remove('open');
    }
  }

  init();
</script>
</body>
</html>
