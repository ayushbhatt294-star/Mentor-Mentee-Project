      <input id="mother_name" class="input-field" placeholder="Mother Name">

<script>
const BASE_URL = "http://localhost:5000";
const TOKEN_KEY = "mentee_token";

function getToken(){
  return localStorage.getItem(TOKEN_KEY);
}

const fields = [
  "student_name","roll_no","enrollment_no","student_email",
  "student_contact","semester","batch","program_name",
  "father_name","father_email","father_contact",
  "mother_name","mother_email","mother_contact"
];

async function fetchProfile(){
  const res = await fetch(`${BASE_URL}/api/mentee/profile`,{
    headers:{
      Authorization:`Bearer ${getToken()}`
    }
  });

  if(!res.ok) throw new Error("Failed to fetch");
  return await res.json();
}

async function updateProfile(payload){
  const res = await fetch(`${BASE_URL}/api/mentee/profile`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      Authorization:`Bearer ${getToken()}`
    },
    body:JSON.stringify(payload)
  });

  if(!res.ok) throw new Error("Update failed");
  return await res.json();
}

function populate(data){
  fields.forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.value = data[id] || "";
  });

  document.getElementById("student-name-display").textContent =
    data.student_name || "—";

  document.getElementById("roll-display").textContent =
    "Roll No: " + (data.roll_no || "—");

  document.getElementById("program-display").textContent =
    data.program_name || "—";

  document.getElementById("sidebar-name").textContent =
    data.student_name || "Loading...";

  document.getElementById("sidebar-program").textContent =
    data.program_name || "--";

  const initials = (data.student_name || "")
    .split(" ")
    .map(x => x[0])
    .join("")
    .substring(0,2)
    .toUpperCase();

  document.getElementById("avatar").textContent = initials || "--";
  document.getElementById("sidebar-avatar").textContent = initials || "--";
}

async function loadProfile(){
  try{
    const data = await fetchProfile();
    populate(data);
  } catch(err){
    alert("Could not load profile");
  }
}

async function saveProfile(){
  const payload = {};

  fields.forEach(id=>{
    payload[id] = document.getElementById(id).value;
  });

  try{
    await updateProfile(payload);
    alert("Profile updated successfully");
    loadProfile();
  } catch(err){
    alert("Update failed");
  }
}

loadProfile();
</script>
